services:
  mariadb:
    container_name: mariadb
    build:
      context: ./requirements/mariadb/
    environment:
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
    volumes:
      - wp_data:/var/lib/mysql
    networks:
      - inception
    expose:
      - "3306"
    restart: always

  wordpress:
    container_name: wp
    build:
      context: ./requirements/wordpress/
    depends_on:
      - mariadb
    volumes:
      - wp_files:/var/www/html
    networks:
      - inception
    restart: always
    expose:
      - "9000"

  nginx:
    container_name: nginx
    build:
      context: ./requirements/nginx/
    depends_on:
      - wordpress
    ports:
      - "80:80"
      - "443:443"
    networks:
      - inception
    volumes:
      - wp_files:/var/www/html
    restart: always

volumes:
  wp_data:
  wp_files:

networks:
  inception:
    driver: bridge
